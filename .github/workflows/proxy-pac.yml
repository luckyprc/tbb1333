name: Fetch Proxies & Deploy PAC

on:
  schedule:
    # 北京时间 7:00, 10:00, 13:00, 16:00, 19:00
    # GitHub Actions 2026.03 起支持 timezone 字段
    - cron: "0 7,10,13,16,19 * * *"
      timezone: "Asia/Shanghai"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install aiohttp aiohttp-socks asyncio-dns

      - name: Fetch & Verify Proxies
        run: python scripts/fetch_proxies.py
        timeout-minutes: 10

      - name: Generate PAC File
        run: python scripts/generate_pac.py

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
